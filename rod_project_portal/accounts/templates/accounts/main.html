{% extends 'accounts/base.html' %}

{% block title %}
Главная
{% endblock %}

{% block body %}
<div class="container py-4" style="max-width: 900px;">
    <div class="row g-4">

        <!-- Карточка: Звонки -->
        <div class="col-12 col-sm-6 col-md-4">
            <a href="{% url 'calls:contacts' %}"
               class="card text-decoration-none shadow-sm border-0 rounded-4 h-100 p-3 bg-body-secondary text-dark transition-hover">
                <div class="card-body d-flex flex-column align-items-center text-center">
                    <div class="icon-box bg-info bg-opacity-10 text-info rounded-circle d-flex align-items-center justify-content-center mb-3"
                         style="width: 64px; height: 64px;">
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="30"
                             height="30"
                             fill="currentColor" class="bi bi-telephone" viewBox="0 0 16 16">
                            <path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.611l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.362-1.03-.037-2.137.703-2.877z"></path>
                        </svg>
                    </div>
                    <h5 class="fw-bold mb-1 text-white">Звонки</h5>
                </div>
            </a>
        </div>

        <!-- Карточка: YouTube -->
        <div class="col-12 col-sm-6 col-md-4">
            <a href="{% url 'youtube:youtube' %}"
               class="card text-decoration-none shadow-sm border-0 rounded-4 h-100 p-3 bg-body-secondary text-dark transition-hover">
                <div class="card-body d-flex flex-column align-items-center text-center">
                    <div class="icon-box bg-danger bg-opacity-10 text-danger rounded-circle d-flex align-items-center justify-content-center mb-3"
                         style="width: 64px; height: 64px;">
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="30"
                             height="30"
                             fill="currentColor" class="bi bi-youtube" viewBox="0 0 16 16">
                            <path d="M8.051 1.999h.089c.822.003 4.987.033 6.11.335a2.01 2.01 0 0 1 1.415 1.42c.101.38.172.883.22 1.402l.01.104.022.26.008.104c.065.914.073 1.77.074 1.957v.075c-.001.194-.01 1.108-.082 2.06l-.008.105-.009.104c-.05.572-.124 1.14-.235 1.558a2.01 2.01 0 0 1-1.415 1.42c-1.16.312-5.569.334-6.18.335h-.142c-.309 0-1.587-.006-2.927-.052l-.17-.006-.087-.004-.171-.007-.171-.007c-1.11-.049-2.167-.128-2.654-.26a2.01 2.01 0 0 1-1.415-1.419c-.111-.417-.185-.986-.235-1.558L.09 9.82l-.008-.104A31 31 0 0 1 0 7.68v-.123c.002-.215.01-.958.064-1.778l.007-.103.003-.052.008-.104.022-.26.01-.104c.048-.519.119-1.023.22-1.402a2.01 2.01 0 0 1 1.415-1.42c.487-.13 1.544-.21 2.654-.26l.17-.007.172-.006.086-.003.171-.007A100 100 0 0 1 7.858 2zM6.4 5.209v4.818l4.157-2.408z"></path>
                        </svg>
                    </div>
                    <h5 class="fw-bold mb-1 text-white">YouTube</h5>
                </div>
            </a>
        </div>

        <!-- Карточка: VPN / Proxy -->
        <div class="col-12 col-sm-6 col-md-4">
            <a href="{% url 'accounts:services' %}"
               class="card text-decoration-none shadow-sm border-0 rounded-4 h-100 p-3 bg-body-secondary text-dark transition-hover">
                <div class="card-body d-flex flex-column align-items-center text-center">
                    <div class="icon-box bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center mb-3"
                         style="width: 64px; height: 64px;">
                        <svg aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="30"
                             height="30"
                             fill="currentColor" class="bi bi-reception-4" viewBox="0 0 16 16">
                            <path d="M0 11.5a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5zm4-3a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5zm4-3a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5zm4-3a.5.5 0 0 1 .5-.5h2a.5.5 0 0 1 .5.5v11a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5z"></path>
                        </svg>
                    </div>
                    <h5 class="fw-bold mb-1 text-white">VPN / Proxy</h5>
                </div>
            </a>
        </div>

    </div>
</div>

<style>
    .transition-hover {
        transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }
    .transition-hover:hover {
        transform: translateY(-4px);
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important;
    }
</style>
{% endblock %}

{% block scripts %}
<script src="/static/js/notification.js"></script>
{% endblock %}
