services:
  portal:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: rod_project_portal_container
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      uvicorn rod_project_portal.asgi:application --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    networks:
      - default
      - remnawave-network
      #    ports:
      #      - "8000:8000"
    volumes:
      - ./db:/app/db
    depends_on:
      - portal_redis
    restart: unless-stopped

  portal_redis:
    image: redis:7-alpine
    container_name: rod_project_redis_container
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    network_mode: host
    restart: unless-stopped
    command:
      - -n
      - --realm=rod-project.24-7.ro
      - --listening-port=3478
      - --external-ip=${TURN_HOST}
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --no-multicast-peers
      - --no-tls
      - --no-dtls
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

networks:
  remnawave-network:
    external: true

    # для запуска проекта вне контейнера
#    ports:
#      - "6379:6379"