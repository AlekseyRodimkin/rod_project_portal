services:
  portal:
    build:
      dockerfile: ./Dockerfile
    container_name: rod_project_portal_container
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata accounts/fixtures/initial_data.json &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 rod_project_portal.wsgi:application"
    ports:
      - "8000:8000"
    volumes:
      - /var/www/rod_project_portal/static:/rod_project_portal/static:ro
      - ./db:/app/db
    restart: unless-stopped