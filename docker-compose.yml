services:
  portal:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: rod_project_portal_container
    env_file: .env
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      uvicorn rod_project_portal.asgi:application --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    networks:
      - default
      - remnawave-network
#    ports:
      #      - "8000:8000"
    volumes:
      - ./db:/app/db
    depends_on:
      - portal_redis
    restart: unless-stopped

  portal_redis:
    image: redis:7-alpine
    container_name: rod_project_redis_container
    restart: unless-stopped

networks:
  remnawave-network:
    external: true

    # для запуска проекта вне контейнера
#    ports:
#      - "6379:6379"