services:
  portal:
    build:
      dockerfile: ./Dockerfile
    container_name: rod_project_portal_container
    env_file: .env
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 rod_project_portal.wsgi:application"
    ports:
      - "8000:8000"
    volumes:
      - /var/www/rod_project_portal/static:/app/static
      - ./db:/app/db
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rod_project_redis_container
    restart: unless-stopped